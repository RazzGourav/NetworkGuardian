# NetworkGuardian — Docker Compose
# Services are added incrementally per phase.
#
# Phase 1: mininet-controller (topology + Ryu SDN controller)
# Phase 2: monitoring-agent, influxdb (or sqlite volume)
# Phase 5: backend, frontend

version: "3.9"

services:
  # ── Phase 1: Combined Mininet + Ryu controller ────────────────────
  mininet-controller:
    build:
      context: .
      dockerfile: topology/Dockerfile
    container_name: networkguardian-mininet
    privileged: true
    network_mode: host
    stdin_open: true
    tty: true
    volumes:
      - /lib/modules:/lib/modules:ro
      - ./logs:/app/logs:rw
      - ovs_conf:/etc/openvswitch  # Share logs with host for debugging
    restart: unless-stopped

  # ── Phase 2: Monitoring Agent + Metrics Storage ───────────────────
  monitoring-agent:
    build:
      context: .
      dockerfile: monitoring/Dockerfile
    container_name: networkguardian-monitoring
    network_mode: host  # Need to ping hosts in the topology
    depends_on:
      - mininet-controller
    volumes:
      - ./data:/app/data:rw
      - ./logs:/app/logs:rw
      - ovs_conf:/etc/openvswitch
      - /lib/modules:/lib/modules:ro
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    # Wait for mininet to be ready before starting monitoring
    healthcheck:
      test: ["CMD", "ping", "-c", "1", "10.0.0.1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Phase 5: Dashboard & Visualization ─────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: networkguardian-backend
    ports:
      - "5000:5000"
    depends_on:
      - monitoring-agent
    volumes:
      - ./data:/app/data:ro
      - ./frontend:/app/frontend:ro
      - ./backend:/app/backend:ro
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

volumes:
  ovs_conf:
